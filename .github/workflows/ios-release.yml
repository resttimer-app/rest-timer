# GitHub の Mac で App Store 用（production）ビルドを作り、App Store Connect（TestFlight）へ送る。
# 必要なシークレット: EXPO_TOKEN のみ。
# App Store Connect へのログインには、EAS に保管済みの API キー（[Expo] EAS Submit …）を使う。
name: iOS release

on:
  workflow_dispatch:

jobs:
  release:
    # Expo SDK 57 は Xcode 26.4 以上が必要（macos-15 の Xcode は 26.3 まで）。入っている最新の Xcode を選ぶ
    runs-on: macos-26
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # App Store に上げるビルド番号は毎回上げる（preview とは別の番号帯）
      - name: Set build number
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.ios.buildNumber = String(1000 + Number(process.env.GITHUB_RUN_NUMBER));
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("buildNumber", app.expo.ios.buildNumber);
          '

      - name: Build
        run: npx eas-cli@latest build --local --platform ios --profile production --non-interactive --output ./MixTimer.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MixTimer-appstore-ipa
          path: MixTimer.ipa

      - name: Submit to App Store Connect
        run: npx eas-cli@latest submit --platform ios --profile production --path ./MixTimer.ipa --non-interactive
